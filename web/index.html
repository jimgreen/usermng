<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>用户管理</title>
    <style>
      :root { color: #172033; background: #f4f7fb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { align-items: center; background: linear-gradient(120deg, #162b4d, #23518f); color: #fff; display: flex; justify-content: space-between; padding: 20px clamp(18px, 4vw, 48px); }
      header h1 { font-size: 22px; margin: 0 0 4px; }
      header p, header small { color: #dbeafe; font-size: 13px; margin: 0; }
      main { margin: 24px auto 50px; max-width: 1360px; padding: 0 18px; }
      button, input, select, textarea { font: inherit; }
      button { border: 0; border-radius: 7px; cursor: pointer; padding: 9px 14px; transition: .15s ease; }
      button:hover:not(:disabled) { filter: brightness(.96); transform: translateY(-1px); }
      button:disabled { cursor: not-allowed; opacity: .5; }
      button.primary { background: #2563eb; color: #fff; }
      button.success { background: #059669; color: #fff; }
      button.danger { background: #dc2626; color: #fff; }
      button.muted { background: #e8edf4; color: #334155; }
      .summary-grid { display: grid; gap: 12px; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-bottom: 18px; }
      .metric { background: #fff; border: 1px solid #e5eaf2; box-shadow: 0 4px 16px #16345b0c; color: #172033; min-height: 94px; padding: 15px; text-align: left; }
      .metric:hover { border-color: #93c5fd; }
      .metric strong { display: block; font-size: 25px; margin-top: 8px; }
      .metric span { color: #64748b; font-size: 13px; }
      .dashboard-grid { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 18px; }
      .panel { background: #fff; border: 1px solid #e5eaf2; border-radius: 12px; box-shadow: 0 4px 16px #16345b0c; min-height: 170px; padding: 16px; }
      .panel h2 { font-size: 15px; margin: 0; }
      .panel-head { align-items: center; display: flex; justify-content: space-between; margin-bottom: 13px; }
      .panel-head small { color: #64748b; font-size: 12px; }
      .coverage-row { align-items: center; display: grid; gap: 8px; grid-template-columns: 76px 1fr 42px; margin: 10px 0; }
      .coverage-row label, .coverage-row strong { font-size: 12px; }
      .coverage-track { background: #e8eef7; border-radius: 999px; height: 8px; overflow: hidden; }
      .coverage-track i { background: linear-gradient(90deg, #2563eb, #60a5fa); border-radius: inherit; display: block; height: 100%; }
      .mini-list { display: grid; gap: 7px; margin: 0; padding: 0; }
      .mini-list li { align-items: center; display: flex; font-size: 13px; justify-content: space-between; list-style: none; }
      .mini-list li span:last-child { color: #64748b; font-size: 12px; }
      .mini-list .status { margin-left: 6px; }
      .list-kind { background: #dbeafe; border-radius: 4px; color: #1d4ed8; font-size: 10px; font-style: normal; margin-right: 6px; padding: 2px 4px; }
      .list-kind.role-kind { background: #ede9fe; color: #6d28d9; }
      .panel-empty { color: #94a3b8; font-size: 13px; padding: 18px 0; text-align: center; }
      .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
      .tab { background: #e4eaf3; color: #334155; }
      .tab.active { background: #2563eb; color: #fff; }
      .card { background: #fff; border: 1px solid #e5eaf2; border-radius: 12px; box-shadow: 0 4px 16px #16345b0c; padding: 18px; }
      .toolbar { align-items: center; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      .toolbar .search { flex: 1 1 280px; }
      input, select, textarea { background: #fff; border: 1px solid #cbd5e1; border-radius: 7px; color: #172033; padding: 9px 10px; width: 100%; }
      .toolbar input, .toolbar select { width: auto; }
      .toolbar select { min-width: 125px; }
      .toolbar .filter-wide { min-width: 160px; }
      .filter-clear { color: #2563eb; font-size: 12px; padding: 6px 8px; }
      .selection-bar { align-items: center; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 7px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin-bottom: 12px; padding: 8px 10px; }
      .selection-bar span { color: #1e40af; font-size: 13px; }
      .selection-actions { display: flex; flex-wrap: wrap; gap: 6px; }
      .table-wrap { overflow-x: auto; }
      table { border-collapse: collapse; min-width: 760px; width: 100%; }
      th, td { border-bottom: 1px solid #edf0f5; padding: 11px 8px; text-align: left; vertical-align: middle; }
      th { color: #64748b; font-size: 13px; font-weight: 600; white-space: nowrap; }
      td { font-size: 14px; }
      tr:hover td { background: #fafcff; }
      .checkbox { accent-color: #2563eb; height: 16px; width: 16px; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; }
      .actions button { font-size: 12px; padding: 6px 9px; }
      .badge { background: #e0e7ff; border-radius: 999px; color: #3730a3; display: inline-block; font-size: 12px; margin: 2px; padding: 3px 8px; }
      .status { border-radius: 999px; display: inline-block; font-size: 12px; padding: 3px 9px; }
      .status.on { background: #dcfce7; color: #166534; }
      .status.off { background: #fee2e2; color: #991b1b; }
      .muted { color: #64748b; }
      .empty { padding: 40px 10px; text-align: center; }
      .pager { align-items: center; display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
      .pager span { color: #64748b; font-size: 13px; }
      .loading { color: #2563eb; font-size: 13px; margin-left: 4px; }
      .modal { align-items: center; background: #0f172a66; display: none; inset: 0; justify-content: center; padding: 18px; position: fixed; z-index: 5; }
      .modal.open { display: flex; }
      .dialog { background: #fff; border-radius: 12px; max-height: 92vh; overflow: auto; padding: 24px; width: min(700px, 100%); }
      .dialog h2 { margin: 0 0 18px; }
      .field { margin: 13px 0; }
      .field > label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
      .field textarea { min-height: 76px; resize: vertical; }
      .checks { border: 1px solid #e2e8f0; border-radius: 7px; display: grid; gap: 5px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); max-height: 190px; overflow: auto; padding: 10px; }
      .checks label { font-size: 13px; font-weight: 400; }
      .checks-tools { align-items: center; display: flex; gap: 6px; margin-bottom: 6px; }
      .checks-tools input { flex: 1; padding: 7px 8px; }
      .checks-tools button { font-size: 12px; padding: 6px 8px; }
      .check-option.is-hidden { display: none; }
      code { background: #f1f5f9; border-radius: 4px; color: #334155; padding: 2px 5px; }
      .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
      #message { background: #172b4d; border-radius: 7px; bottom: 20px; box-shadow: 0 4px 18px #0003; color: #fff; display: none; padding: 11px 15px; position: fixed; right: 20px; z-index: 10; }
      @media (max-width: 1050px) { .summary-grid, .dashboard-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @media (max-width: 760px) { .dashboard-grid { grid-template-columns: 1fr; } }
      @media (max-width: 620px) { header { align-items: flex-start; flex-direction: column; gap: 8px; } .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .toolbar input, .toolbar select { flex: 1 1 140px; width: 100%; } main { margin-top: 16px; padding: 0 10px; } }
    </style>
  </head>
  <body>
    <header>
      <div><h1>用户、用户组与权限管理</h1><p>轻量化控制台 · SQLite 持久化 · 快捷键 / 搜索 · 批量操作</p></div>
      <small id="health">连接检查中…</small>
    </header>
    <main>
      <section class="summary-grid" id="summary"></section>
      <section class="dashboard-grid">
        <article class="panel"><div class="panel-head"><h2>数据覆盖</h2><small id="insightStatus">统计加载中…</small></div><div id="coverage"></div></article>
        <article class="panel"><div class="panel-head"><h2>最近新增用户</h2><button class="filter-clear" id="refreshInsights">刷新</button></div><div id="recentUsers"></div></article>
        <article class="panel"><div class="panel-head"><h2>高频使用的组与角色</h2><small>按成员数</small></div><div id="topItems"></div></article>
      </section>
      <nav class="tabs" id="tabs"></nav>
      <section class="card">
        <div class="toolbar">
          <input class="search" id="search" placeholder="搜索用户名、名称、编码…（按 / 聚焦）" />
          <select id="statusFilter"><option value="all">全部状态</option><option value="active">仅启用</option><option value="inactive">仅禁用</option></select>
          <select class="filter-wide" id="groupFilter"><option value="">全部用户组</option></select>
          <select id="sort"><option value="name">按名称正序</option><option value="-name">按名称倒序</option><option value="created_at">按创建时间</option><option value="-created_at">按最新创建</option></select>
          <select id="pageSize"><option value="20">每页 20</option><option value="50">每页 50</option><option value="100">每页 100</option></select>
          <button class="filter-clear" id="clearFilters">清除筛选</button><button class="primary" id="add">新增</button><button class="muted" id="export">导出当前结果</button><button class="muted" id="refresh">刷新</button><span class="loading" id="loading"></span>
        </div>
        <div class="selection-bar" id="selectionBar" hidden><span id="selectionInfo"></span><div class="selection-actions" id="selectionActions"></div></div>
        <div class="table-wrap" id="table"></div><div class="pager" id="pager"></div>
      </section>
    </main>
    <div class="modal" id="modal"><div class="dialog"><h2 id="form-title">新增</h2><form id="form"></form></div></div><div id="message"></div>
    <script>
      const state = { kind: 'users', items: [], selected: new Set(), page: 1, pageSize: 20, search: '', status: 'all', groupId: '', sort: 'name', refs: { users: [], groups: [], roles: [], permissions: [] }, editing: null, summary: { users: 0, active_users: 0, groups: 0, roles: 0, permissions: 0, memberships: 0 }, insights: null }
      const $ = (id) => document.getElementById(id)
      const api = async (url, options = {}) => { const response = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options }); if (!response.ok) { let detail = response.statusText; try { detail = (await response.json()).detail || detail } catch {} throw new Error(detail) } return response.status === 204 ? null : response.json() }
      const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
      const toast = (text) => { $('message').textContent = text; $('message').style.display = 'block'; clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => { $('message').style.display = 'none' }, 2400) }
      const labels = (items) => (items || []).map((item) => `<span class="badge">${esc(item.name || item)}</span>`).join('') || '<span class="muted">-</span>'
      const endpoint = (kind) => kind === 'users' ? '/api/v1/users/users/' : kind === 'groups' ? '/api/v1/users/groups/' : `/api/v1/rbac/${kind}/`
      const kindName = (kind) => ({ users: '用户', groups: '用户组', roles: '角色', permissions: '权限' })[kind]
      const formatDate = (value) => value ? String(value).replace('T', ' ').slice(0, 16) : '-'
      const selectedIds = () => [...state.selected].map(Number)
      async function loadSummary() { try { state.summary = await api('/api/summary') } catch (error) { toast(error.message) } renderSummary(); renderTabs(); renderGroupFilter() }
      async function loadInsights() { try { state.insights = await api('/api/insights'); renderInsights(); $('insightStatus').textContent = `更新于 ${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}` } catch (error) { $('insightStatus').textContent = '统计不可用'; toast(error.message) } }
      function renderSummary() { const cards = [['users', '用户总数', state.summary.users], ['active_users', '启用用户', state.summary.active_users], ['groups', '用户组', state.summary.groups], ['roles', '角色', state.summary.roles], ['permissions', '权限', state.summary.permissions], ['memberships', '用户组关系', state.summary.memberships]]; $('summary').innerHTML = cards.map(([key, label, value]) => `<button class="metric" data-kind="${key === 'active_users' || key === 'memberships' ? 'users' : key}" data-status="${key === 'active_users' ? 'active' : 'all'}"><span>${label}</span><strong>${value ?? 0}</strong></button>`).join(''); if (state.insights) renderInsights() }
      function renderTabs() { $('tabs').innerHTML = ['users', 'groups', 'roles', 'permissions'].map((kind) => `<button class="tab ${state.kind === kind ? 'active' : ''}" data-kind="${kind}">${kindName(kind)} <span>(${state.summary[kind] ?? 0})</span></button>`).join('') }
      function renderGroupFilter() { const current = state.groupId; $('groupFilter').innerHTML = '<option value="">全部用户组</option>' + state.refs.groups.map((group) => `<option value="${group.id}">${esc(group.name)} (${group.users_count ?? group.users?.length ?? 0})</option>`).join(''); $('groupFilter').value = current; }
      async function loadRefs() { const [users, groups, roles, permissions] = await Promise.all([api('/api/v1/users/users/?page_size=500'), api('/api/v1/users/groups/?page_size=500'), api('/api/v1/rbac/roles/?page_size=500'), api('/api/v1/rbac/permissions/?page_size=500')]); state.refs = { users: users.results, groups: groups.results, roles: roles.results, permissions: permissions.results }; renderGroupFilter() }
      async function load() { state.search = $('search').value.trim(); state.pageSize = Number($('pageSize').value); state.sort = $('sort').value; state.status = $('statusFilter').value; state.groupId = $('groupFilter').value; const params = new URLSearchParams({ page: state.page, page_size: state.pageSize, search: state.search, sort: state.sort }); if (state.kind === 'users' && state.status !== 'all') params.set('is_active', state.status === 'active' ? 'true' : 'false'); if (state.kind === 'users' && state.groupId) params.set('group_id', state.groupId); $('loading').textContent = '加载中…'; try { const data = await api(`${endpoint(state.kind)}?${params}`); state.items = data.results || []; state.total = data.count || 0; state.selected.clear(); render() } catch (error) { toast(error.message) } finally { $('loading').textContent = '' } }
      function renderInsights() { const data = state.insights; if (!data) return; const total = Math.max(state.summary.users, 1); const rows = [['有用户组', data.coverage.users_with_group], ['无用户组', data.coverage.users_without_group], ['有角色', data.coverage.users_with_role], ['无角色', data.coverage.users_without_role]]; $('coverage').innerHTML = rows.map(([label, value]) => `<div class="coverage-row"><label>${label}</label><div class="coverage-track"><i style="width:${Math.min(100, Math.round(value / total * 100))}%"></i></div><strong>${value}</strong></div>`).join(''); const recent = data.recent_users || []; $('recentUsers').innerHTML = recent.length ? `<ul class="mini-list">${recent.map((item) => `<li><span>${esc(item.name)} <span class="muted">(${esc(item.username)})</span></span><span>${formatDate(item.created_at)} <span class="status ${item.is_active ? 'on' : 'off'}">${item.is_active ? '启用' : '禁用'}</span></span></li>`).join('')}</ul>` : '<div class="panel-empty">暂无用户</div>'; const groups = (data.top_groups || []).map((item) => `<li><span><em class="list-kind">组</em>${esc(item.name)}</span><span>${item.users_count} 人</span></li>`); const roles = (data.top_roles || []).map((item) => `<li><span><em class="list-kind role-kind">角色</em>${esc(item.name)}</span><span>${item.users_count} 人 · ${item.permissions_count} 权限</span></li>`); $('topItems').innerHTML = groups.length || roles.length ? `<ul class="mini-list">${groups.slice(0, 3).join('')}${roles.slice(0, 3).join('')}</ul>` : '<div class="panel-empty">暂无组或角色</div>' }
      function render() {
        const kind = state.kind; let head = ''; let body = ''; const selectAll = state.items.length > 0 && state.items.every((item) => state.selected.has(item.id)); const check = `<input class="checkbox" type="checkbox" data-select-all ${selectAll ? 'checked' : ''} aria-label="全选当前页">`
        if (kind === 'users') { head = `<tr><th>${check}</th><th>姓名</th><th>用户名</th><th>邮箱</th><th>用户组</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th></tr>`; body = state.items.map((item) => `<tr><td><input class="checkbox" type="checkbox" data-select-id="${item.id}" ${state.selected.has(item.id) ? 'checked' : ''}></td><td>${esc(item.name)}</td><td>${esc(item.username)}</td><td>${esc(item.email) || '<span class="muted">-</span>'}</td><td>${labels(item.groups)}</td><td>${labels(item.roles)}</td><td><span class="status ${item.is_active ? 'on' : 'off'}">${item.is_active ? '启用' : '禁用'}</span></td><td class="muted">${formatDate(item.created_at)}</td><td class="actions"><button class="muted" data-action="toggle" data-id="${item.id}">${item.is_active ? '停用' : '启用'}</button><button class="muted" data-action="edit" data-id="${item.id}">编辑</button><button class="danger" data-action="delete" data-id="${item.id}">删除</button></td></tr>`).join('') }
        else if (kind === 'groups') { head = `<tr><th>${check}</th><th>名称</th><th>说明</th><th>成员数</th><th>创建时间</th><th>操作</th></tr>`; body = state.items.map((item) => `<tr><td><input class="checkbox" type="checkbox" data-select-id="${item.id}" ${state.selected.has(item.id) ? 'checked' : ''}></td><td>${esc(item.name)}</td><td>${esc(item.comment) || '<span class="muted">-</span>'}</td><td>${item.users_count ?? item.users?.length ?? 0}</td><td class="muted">${formatDate(item.created_at)}</td><td class="actions"><button class="success" data-action="add-all" data-id="${item.id}">加入全部用户</button><button class="muted" data-action="remove-all" data-id="${item.id}">清空成员</button><button class="muted" data-action="edit" data-id="${item.id}">编辑</button><button class="danger" data-action="delete" data-id="${item.id}">删除</button></td></tr>`).join('') }
        else if (kind === 'roles') { head = `<tr><th>${check}</th><th>名称</th><th>说明</th><th>权限数</th><th>成员数</th><th>创建时间</th><th>操作</th></tr>`; body = state.items.map((item) => `<tr><td><input class="checkbox" type="checkbox" data-select-id="${item.id}" ${state.selected.has(item.id) ? 'checked' : ''}></td><td>${esc(item.name)}</td><td>${esc(item.comment) || '<span class="muted">-</span>'}</td><td>${item.permissions_count ?? item.permissions?.length ?? 0}</td><td>${item.users_count ?? item.users?.length ?? 0}</td><td class="muted">${formatDate(item.created_at)}</td><td class="actions"><button class="muted" data-action="edit" data-id="${item.id}">编辑</button><button class="danger" data-action="delete" data-id="${item.id}">删除</button></td></tr>`).join('') }
        else { head = `<tr><th>${check}</th><th>编码</th><th>名称</th><th>资源</th><th>动作</th><th>创建时间</th><th>操作</th></tr>`; body = state.items.map((item) => `<tr><td><input class="checkbox" type="checkbox" data-select-id="${item.id}" ${state.selected.has(item.id) ? 'checked' : ''}></td><td><code>${esc(item.code)}</code></td><td>${esc(item.name)}</td><td>${esc(item.resource)}</td><td>${esc(item.action)}</td><td class="muted">${formatDate(item.created_at)}</td><td class="actions"><button class="muted" data-action="edit" data-id="${item.id}">编辑</button><button class="danger" data-action="delete" data-id="${item.id}">删除</button></td></tr>`).join('') }
        $('table').innerHTML = `<table><thead>${head}</thead><tbody>${body || '<tr><td colspan="8" class="empty muted">暂无数据</td></tr>'}</tbody></table>`; const pages = Math.max(1, Math.ceil((state.total || 0) / state.pageSize)); $('pager').innerHTML = `<span>共 ${state.total || 0} 条 · 第 ${state.page} / ${pages} 页</span><button class="muted" data-page="prev" ${state.page <= 1 ? 'disabled' : ''}>上一页</button><button class="muted" data-page="next" ${state.page >= pages ? 'disabled' : ''}>下一页</button>`; renderSelection()
      }
      function renderSelection() { const count = state.selected.size; $('selectionBar').hidden = count === 0; $('selectionInfo').textContent = `已选择 ${count} 项`; $('selectionActions').innerHTML = state.kind === 'users' ? '<button class="success" data-bulk="enable">批量启用</button><button class="muted" data-bulk="disable">批量禁用</button><button class="danger" data-bulk="delete">批量删除</button>' : '<button class="danger" data-bulk="delete">批量删除</button>' }
      const checkboxGroup = (name, title, items, selected, labelKey = 'name') => `<div class="field"><label>${title}</label><div class="checks-tools"><input placeholder="筛选${title}…" data-rel-search="${name}"><button type="button" data-checks-all="${name}">全选</button><button type="button" data-checks-none="${name}">清空</button></div><div class="checks" data-checks="${name}">${items.map((item) => `<label class="check-option" data-rel-option="${name}"><input class="checkbox" type="checkbox" name="${name}" value="${item.id}" ${selected.includes(item.id) ? 'checked' : ''}> ${esc(item[labelKey] || item.name || item.code || item.username)}</label>`).join('') || '<span class="muted">暂无可选项</span>'}</div></div>`
      function openForm(item = null) { state.editing = item; const kind = state.kind; $('form-title').textContent = `${item ? '编辑' : '新增'}${kindName(kind)}`; let html = ''; if (kind === 'users') html = `<div class="field"><label>用户名</label><input name="username" required value="${esc(item?.username)}"></div><div class="field"><label>姓名</label><input name="name" required value="${esc(item?.name)}"></div><div class="field"><label>邮箱</label><input name="email" type="email" value="${esc(item?.email)}"></div><div class="field"><label>备注</label><textarea name="comment">${esc(item?.comment)}</textarea></div>${checkboxGroup('groups', '用户组', state.refs.groups, (item?.groups || []).map((x) => x.id))}${checkboxGroup('roles', '角色', state.refs.roles, (item?.roles || []).map((x) => x.id))}`; if (kind === 'groups') html = `<div class="field"><label>名称</label><input name="name" required value="${esc(item?.name)}"></div><div class="field"><label>说明</label><textarea name="comment">${esc(item?.comment)}</textarea></div>${checkboxGroup('users', '成员', state.refs.users, item?.users || [])}`; if (kind === 'roles') html = `<div class="field"><label>名称</label><input name="name" required value="${esc(item?.name)}"></div><div class="field"><label>说明</label><textarea name="comment">${esc(item?.comment)}</textarea></div>${checkboxGroup('permissions', '权限', state.refs.permissions, item?.permissions || [], 'code')}${checkboxGroup('users', '成员', state.refs.users, item?.users || [])}`; if (kind === 'permissions') html = `<div class="field"><label>编码</label><input name="code" required value="${esc(item?.code)}"></div><div class="field"><label>名称</label><input name="name" required value="${esc(item?.name)}"></div><div class="field"><label>资源</label><input name="resource" value="${esc(item?.resource)}"></div><div class="field"><label>动作</label><input name="action" value="${esc(item?.action)}"></div>`; $('form').innerHTML = `${html}<div class="dialog-actions"><button type="button" data-action="close-form">取消</button><button class="primary" type="submit">保存 <span class="muted">(Ctrl+Enter)</span></button></div>`; $('modal').classList.add('open'); $('form').querySelector('input')?.focus() }
      function closeForm() { $('modal').classList.remove('open'); state.editing = null }
      function formData() { const data = Object.fromEntries(new FormData($('form')).entries()); for (const name of ['groups', 'roles', 'users', 'permissions']) data[name] = [...$('form').querySelectorAll(`input[name="${name}"]:checked`)].map((input) => Number(input.value)); return data }
      async function saveForm(event) { event.preventDefault(); const base = endpoint(state.kind); try { await api(state.editing ? `${base}${state.editing.id}/` : base, { method: state.editing ? 'PATCH' : 'POST', body: JSON.stringify(formData()) }); closeForm(); toast('保存成功'); await Promise.all([loadSummary(), loadRefs(), load(), loadInsights()]) } catch (error) { toast(error.message) } }
      async function deleteItems(ids) { if (!ids.length || !confirm(`确定删除选中的 ${ids.length} 项吗？关联关系也会同步删除。`)) return; try { await api(`${endpoint(state.kind)}?ids=${ids.join(',')}`, { method: 'DELETE' }); toast(`已删除 ${ids.length} 项`); await Promise.all([loadSummary(), loadRefs(), load(), loadInsights()]) } catch (error) { toast(error.message) } }
      async function bulkAction(action) { const ids = selectedIds(); if (!ids.length) return; if (action === 'delete') return deleteItems(ids); try { await api('/api/v1/users/users/', { method: 'PATCH', body: JSON.stringify(ids.map((id) => ({ id, is_active: action === 'enable' }))) }); toast(action === 'enable' ? '已批量启用' : '已批量禁用'); await Promise.all([loadSummary(), load()]) } catch (error) { toast(error.message) } }
      async function toggleUser(item) { try { await api(`/api/v1/users/users/${item.id}/status/`, { method: 'PATCH', body: JSON.stringify({ is_active: !item.is_active }) }); toast(item.is_active ? '用户已停用' : '用户已启用'); await Promise.all([loadSummary(), load(), loadInsights()]) } catch (error) { toast(error.message) } }
      async function addAllUsers(id) { if (!confirm('确定把全部用户加入该用户组吗？')) return; try { const result = await api(`/api/v1/users/groups/${id}/add-all-users/`, { method: 'POST' }); toast(`用户组现有 ${result.count} 名成员`); await Promise.all([loadSummary(), loadRefs(), load(), loadInsights()]) } catch (error) { toast(error.message) } }
      async function removeAllUsers(id) { if (!confirm('确定清空该用户组的全部成员吗？')) return; try { const result = await api(`/api/v1/users/groups/${id}/remove-all-users/`, { method: 'POST' }); toast(`已移除 ${result.count} 名成员`); await Promise.all([loadSummary(), loadRefs(), load(), loadInsights()]) } catch (error) { toast(error.message) } }
      function changePage(direction) { const pages = Math.max(1, Math.ceil((state.total || 0) / state.pageSize)); state.page = Math.min(pages, Math.max(1, state.page + direction)); load() }
      function setKind(kind, status = 'all') { state.kind = kind; state.page = 1; state.selected.clear(); state.status = status; state.groupId = ''; $('groupFilter').value = ''; $('statusFilter').style.display = kind === 'users' ? '' : 'none'; $('groupFilter').style.display = kind === 'users' ? '' : 'none'; $('statusFilter').value = kind === 'users' ? status : 'all'; $('sort').innerHTML = kind === 'permissions' ? '<option value="code">按编码正序</option><option value="-code">按编码倒序</option><option value="resource">按资源</option><option value="action">按动作</option>' : '<option value="name">按名称正序</option><option value="-name">按名称倒序</option><option value="created_at">按创建时间</option><option value="-created_at">按最新创建</option>'; renderTabs(); loadRefs().then(load).catch((error) => toast(error.message)) }
      $('tabs').addEventListener('click', (event) => { const tab = event.target.closest('[data-kind]'); if (tab) setKind(tab.dataset.kind) }); $('summary').addEventListener('click', (event) => { const metric = event.target.closest('[data-kind]'); if (metric) setKind(metric.dataset.kind, metric.dataset.status || 'all') })
      $('table').addEventListener('change', (event) => { if (event.target.dataset.selectId) { const id = Number(event.target.dataset.selectId); event.target.checked ? state.selected.add(id) : state.selected.delete(id); renderSelection() } if (event.target.dataset.selectAll) { state.items.forEach((item) => event.target.checked ? state.selected.add(item.id) : state.selected.delete(item.id)); render() } })
      $('table').addEventListener('click', async (event) => { const button = event.target.closest('[data-action]'); if (!button) return; const id = Number(button.dataset.id); const item = state.items.find((entry) => entry.id === id); if (button.dataset.action === 'edit') openForm(item); if (button.dataset.action === 'delete') await deleteItems([id]); if (button.dataset.action === 'toggle') await toggleUser(item); if (button.dataset.action === 'add-all') await addAllUsers(id); if (button.dataset.action === 'remove-all') await removeAllUsers(id) })
      $('selectionActions').addEventListener('click', (event) => { const button = event.target.closest('[data-bulk]'); if (button) bulkAction(button.dataset.bulk) }); $('pager').addEventListener('click', (event) => { const button = event.target.closest('[data-page]'); if (button) changePage(button.dataset.page === 'next' ? 1 : -1) })
      $('form').addEventListener('submit', saveForm); $('form').addEventListener('click', (event) => { if (event.target.closest('[data-action="close-form"]')) closeForm(); const all = event.target.closest('[data-checks-all]'); const none = event.target.closest('[data-checks-none]'); if (all || none) { const name = (all || none).dataset.checksAll || (all || none).dataset.checksNone; $('form').querySelectorAll(`input[name="${name}"]`).forEach((input) => { input.checked = Boolean(all) }) } }); $('form').addEventListener('input', (event) => { const input = event.target.closest('[data-rel-search]'); if (!input) return; const query = input.value.trim().toLowerCase(); $('form').querySelectorAll(`[data-rel-option="${input.dataset.relSearch}"]`).forEach((option) => { option.classList.toggle('is-hidden', query && !option.textContent.toLowerCase().includes(query)) }) }); $('modal').addEventListener('click', (event) => { if (event.target === $('modal')) closeForm() })
      $('add').onclick = () => openForm(); $('refresh').onclick = () => Promise.all([loadSummary(), loadRefs(), load(), loadInsights()]); $('refreshInsights').onclick = () => loadInsights(); $('export').onclick = () => { const params = new URLSearchParams({ kind: state.kind, search: state.search }); if (state.kind === 'users' && state.status !== 'all') params.set('is_active', state.status === 'active' ? 'true' : 'false'); if (state.kind === 'users' && state.groupId) params.set('group_id', state.groupId); window.location.href = `/api/export?${params}` }; $('clearFilters').onclick = () => { $('search').value = ''; $('statusFilter').value = 'all'; $('groupFilter').value = ''; state.page = 1; load() }; $('search').oninput = () => { clearTimeout(window.searchTimer); window.searchTimer = setTimeout(() => { state.page = 1; load() }, 250) }; $('statusFilter').onchange = () => { state.page = 1; load() }; $('groupFilter').onchange = () => { state.page = 1; load() }; $('sort').onchange = () => { state.page = 1; load() }; $('pageSize').onchange = () => { state.page = 1; load() }
      document.addEventListener('keydown', (event) => { if (event.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { event.preventDefault(); $('search').focus() } if (event.key.toLowerCase() === 'n' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') openForm(); if (event.key === 'Escape') closeForm(); if (event.ctrlKey && event.key === 'Enter' && $('modal').classList.contains('open')) $('form').requestSubmit() })
      api('/api/health').then((result) => { $('health').textContent = `SQLite · ${result.database}` }).catch(() => { $('health').textContent = '后端未连接' }); $('groupFilter').style.display = ''; renderTabs(); renderSummary(); Promise.all([loadRefs(), loadSummary(), loadInsights()]).then(load).catch((error) => toast(error.message))
    </script>
  </body>
</html>
