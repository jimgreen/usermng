<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>用户管理</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2937; background: #f4f6f8; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { background: #172b4d; color: #fff; padding: 18px 28px; display: flex; justify-content: space-between; align-items: center; }
      header h1 { margin: 0; font-size: 20px; }
      header small { opacity: .8; }
      main { max-width: 1200px; margin: 24px auto; padding: 0 18px; }
      nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
      button, input, textarea { font: inherit; }
      button { border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; background: #e5e7eb; color: #1f2937; }
      button.primary { background: #2563eb; color: #fff; }
      button.danger { background: #dc2626; color: #fff; }
      button.tab.active { background: #2563eb; color: #fff; }
      .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
      .toolbar input { flex: 1; min-width: 180px; }
      input, textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px; background: #fff; }
      textarea { min-height: 70px; resize: vertical; }
      .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 10px #0000000d; padding: 18px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; border-bottom: 1px solid #eef0f2; padding: 11px 8px; vertical-align: top; }
      th { color: #64748b; font-size: 13px; }
      .actions { display: flex; gap: 6px; flex-wrap: wrap; }
      .badge { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 3px 8px; border-radius: 999px; margin: 2px; font-size: 12px; }
      .muted { color: #64748b; }
      .modal { position: fixed; inset: 0; background: #0f172a66; display: none; align-items: center; justify-content: center; padding: 18px; }
      .modal.open { display: flex; }
      .dialog { background: #fff; width: min(620px, 100%); max-height: 90vh; overflow: auto; border-radius: 10px; padding: 22px; }
      .dialog h2 { margin-top: 0; }
      .field { margin: 12px 0; }
      .field label { display: block; font-weight: 600; margin-bottom: 6px; }
      .checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 6px; max-height: 180px; overflow: auto; border: 1px solid #e5e7eb; padding: 8px; border-radius: 6px; }
      .checks label { font-weight: 400; }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
      #message { position: fixed; right: 18px; bottom: 18px; background: #172b4d; color: #fff; border-radius: 6px; padding: 10px 14px; display: none; }
      @media (max-width: 700px) { th:nth-child(3), td:nth-child(3) { display: none; } header { padding: 15px 18px; } }
    </style>
  </head>
  <body>
    <header><h1>用户、用户组与权限管理</h1><small id="health">连接检查中…</small></header>
    <main>
      <nav id="tabs">
        <button class="tab active" data-kind="users">用户</button>
        <button class="tab" data-kind="groups">用户组</button>
        <button class="tab" data-kind="roles">角色</button>
        <button class="tab" data-kind="permissions">权限</button>
      </nav>
      <section class="card">
        <div class="toolbar"><input id="search" placeholder="搜索名称、用户名或编码" /><button class="primary" id="add">新增</button><button id="refresh">刷新</button></div>
        <div id="table"></div>
      </section>
    </main>
    <div class="modal" id="modal"><div class="dialog"><h2 id="form-title">新增</h2><form id="form"></form></div></div>
    <div id="message"></div>
    <script>
      const state = { kind: 'users', items: [], refs: { users: [], groups: [], roles: [], permissions: [] }, editing: null }
      const $ = (id) => document.getElementById(id)
      const api = async (url, options = {}) => {
        const response = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options })
        if (!response.ok) { let detail = response.statusText; try { detail = (await response.json()).detail || detail } catch {} throw new Error(detail) }
        return response.status === 204 ? null : response.json()
      }
      const toast = (text) => { $('message').textContent = text; $('message').style.display = 'block'; setTimeout(() => $('message').style.display = 'none', 2200) }
      const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
      const labels = (items) => (items || []).map((item) => `<span class="badge">${esc(item.name || item)}</span>`).join('') || '<span class="muted">-</span>'
      async function loadRefs() {
        const [users, groups, roles, permissions] = await Promise.all([
          api('/api/v1/users/users/?page_size=500'), api('/api/v1/users/groups/'), api('/api/v1/rbac/roles/'), api('/api/v1/rbac/permissions/')
        ])
        state.refs = { users: users.results, groups: groups.results, roles: roles.results, permissions: permissions.results }
      }
      async function load() {
        const search = encodeURIComponent($('search').value.trim())
        const url = state.kind === 'users' ? `/api/v1/users/users/?page_size=500&search=${search}` : `/api/v1/${state.kind === 'groups' ? 'users/groups' : `rbac/${state.kind}`}/?search=${search}`
        const data = await api(url); state.items = data.results || []; render()
      }
      function render() {
        const kind = state.kind; let head = ''; let body = ''
        if (kind === 'users') { head = '<tr><th>姓名</th><th>用户名</th><th>邮箱</th><th>用户组</th><th>角色</th><th>状态</th><th>操作</th></tr>'; body = state.items.map((i) => `<tr><td>${esc(i.name)}</td><td>${esc(i.username)}</td><td>${esc(i.email)}</td><td>${labels(i.groups)}</td><td>${labels(i.roles)}</td><td>${i.is_active ? '启用' : '禁用'}</td><td class="actions"><button onclick="editItem(${i.id})">编辑</button><button class="danger" onclick="removeItem(${i.id})">删除</button></td></tr>`).join('') }
        if (kind === 'groups') { head = '<tr><th>名称</th><th>说明</th><th>成员数</th><th>操作</th></tr>'; body = state.items.map((i) => `<tr><td>${esc(i.name)}</td><td>${esc(i.comment)}</td><td>${i.users_count ?? i.users?.length ?? 0}</td><td class="actions"><button onclick="editItem(${i.id})">编辑</button><button class="danger" onclick="removeItem(${i.id})">删除</button></td></tr>`).join('') }
        if (kind === 'roles') { head = '<tr><th>名称</th><th>说明</th><th>权限数</th><th>成员数</th><th>操作</th></tr>'; body = state.items.map((i) => `<tr><td>${esc(i.name)}</td><td>${esc(i.comment)}</td><td>${i.permissions_count ?? i.permissions?.length ?? 0}</td><td>${i.users_count ?? i.users?.length ?? 0}</td><td class="actions"><button onclick="editItem(${i.id})">编辑</button><button class="danger" onclick="removeItem(${i.id})">删除</button></td></tr>`).join('') }
        if (kind === 'permissions') { head = '<tr><th>编码</th><th>名称</th><th>资源</th><th>动作</th><th>操作</th></tr>'; body = state.items.map((i) => `<tr><td>${esc(i.code)}</td><td>${esc(i.name)}</td><td>${esc(i.resource)}</td><td>${esc(i.action)}</td><td class="actions"><button onclick="editItem(${i.id})">编辑</button><button class="danger" onclick="removeItem(${i.id})">删除</button></td></tr>`).join('') }
        $('table').innerHTML = `<table><thead>${head}</thead><tbody>${body || `<tr><td colspan="7" class="muted">暂无数据</td></tr>`}</tbody></table>`
      }
      const checkboxGroup = (name, title, items, selected) => `<div class="field"><label>${title}</label><div class="checks">${items.map((i) => `<label><input type="checkbox" name="${name}" value="${i.id}" ${selected.includes(i.id) ? 'checked' : ''}> ${esc(i.name || i.username || i.code)}</label>`).join('') || '<span class="muted">暂无可选项</span>'}</div></div>`
      function openForm(item = null) {
        state.editing = item; const kind = state.kind; const title = `${item ? '编辑' : '新增'}${kind === 'users' ? '用户' : kind === 'groups' ? '用户组' : kind === 'roles' ? '角色' : '权限'}`; $('form-title').textContent = title
        let html = ''
        if (kind === 'users') html = `<div class="field"><label>用户名</label><input name="username" required value="${esc(item?.username)}"></div><div class="field"><label>姓名</label><input name="name" required value="${esc(item?.name)}"></div><div class="field"><label>邮箱</label><input name="email" value="${esc(item?.email)}"></div><div class="field"><label>备注</label><textarea name="comment">${esc(item?.comment)}</textarea></div>${checkboxGroup('groups', '用户组', state.refs.groups, (item?.groups || []).map((x) => x.id))}${checkboxGroup('roles', '角色', state.refs.roles, (item?.roles || []).map((x) => x.id))}`
        if (kind === 'groups') html = `<div class="field"><label>名称</label><input name="name" required value="${esc(item?.name)}"></div><div class="field"><label>说明</label><textarea name="comment">${esc(item?.comment)}</textarea></div>${checkboxGroup('users', '成员', state.refs.users, item?.users || [])}`
        if (kind === 'roles') html = `<div class="field"><label>名称</label><input name="name" required value="${esc(item?.name)}"></div><div class="field"><label>说明</label><textarea name="comment">${esc(item?.comment)}</textarea></div>${checkboxGroup('permissions', '权限', state.refs.permissions, item?.permissions || [])}${checkboxGroup('users', '成员', state.refs.users, item?.users || [])}`
        if (kind === 'permissions') html = `<div class="field"><label>编码</label><input name="code" required value="${esc(item?.code)}"></div><div class="field"><label>名称</label><input name="name" required value="${esc(item?.name)}"></div><div class="field"><label>资源</label><input name="resource" value="${esc(item?.resource)}"></div><div class="field"><label>动作</label><input name="action" value="${esc(item?.action)}"></div>`
        $('form').innerHTML = `${html}<div class="dialog-actions"><button type="button" onclick="closeForm()">取消</button><button class="primary" type="submit">保存</button></div>`; $('modal').classList.add('open')
      }
      function closeForm() { $('modal').classList.remove('open') }
      function formData() { const data = Object.fromEntries(new FormData($('form')).entries()); for (const name of ['groups', 'roles', 'users', 'permissions']) data[name] = [...$('form').querySelectorAll(`input[name="${name}"]:checked`)].map((x) => Number(x.value)); return data }
      window.editItem = (id) => openForm(state.items.find((x) => x.id === id))
      window.removeItem = async (id) => { if (!confirm('确定删除吗？')) return; try { const base = state.kind === 'users' ? `/api/v1/users/users/${id}/` : state.kind === 'groups' ? `/api/v1/users/groups/${id}/` : `/api/v1/rbac/${state.kind}/${id}/`; await api(base, { method: 'DELETE' }); toast('已删除'); await load(); await loadRefs() } catch (e) { toast(e.message) } }
      $('form').addEventListener('submit', async (event) => { event.preventDefault(); const data = formData(); const base = state.kind === 'users' ? '/api/v1/users/users/' : state.kind === 'groups' ? '/api/v1/users/groups/' : `/api/v1/rbac/${state.kind}/`; try { await api(state.editing ? `${base}${state.editing.id}/` : base, { method: state.editing ? 'PATCH' : 'POST', body: JSON.stringify(data) }); closeForm(); toast('已保存'); await loadRefs(); await load() } catch (e) { toast(e.message) } })
      document.querySelectorAll('.tab').forEach((tab) => tab.addEventListener('click', async () => { document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active')); tab.classList.add('active'); state.kind = tab.dataset.kind; await loadRefs(); await load() }))
      $('add').onclick = () => openForm(); $('refresh').onclick = () => load(); $('search').oninput = () => load()
      api('/api/health').then((x) => { $('health').textContent = `SQLite · ${x.database}` }).catch(() => { $('health').textContent = '后端未连接' }); loadRefs().then(load).catch((e) => toast(e.message))
    </script>
  </body>
</html>
